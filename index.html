<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Danil Trukhonin — Фотограф</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0e0e;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #d4af7a;
      --gap: 6px;
      --pad: 6px;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden; 
    }

    img { display: block; width: 100%; height: auto; background: #161616; }
    a { color: inherit; text-decoration: none; }

    .container { width: 100%; padding: 0 var(--pad); }

    /* Приветствие */
    .hero { text-align: center; padding: 80px 16px 50px; }
    .hero h1 { font-size: clamp(1.8rem, 5vw, 4rem); font-weight: 500; line-height: 1.1; margin-bottom: 16px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); max-width: 520px; margin: 0 auto; font-size: 1rem; }

    /* ===== ГАЛЕРЕЯ ===== */
    .gallery { padding: 10px 0 60px; }
    .gallery-grid { column-count: 3; column-gap: var(--gap); }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: var(--gap);
      border-radius: 4px;
      overflow: hidden;
      background: #161616;
      cursor: pointer;
      position: relative;
      animation: fadeIn 0.6s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .gallery-item img.loaded { opacity: 1; }

    @media (hover: hover) {
      .gallery-item:hover img { transform: scale(1.04); }
    }

    /* ===== ЛАЙТБОКС ===== */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(14, 14, 14, 0.95);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(8px);
    }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.3s ease;
      opacity: 1;
    }
    .lightbox.active .lightbox-img { transform: scale(1); }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      color: #fff; font-size: 40px; line-height: 1;
      cursor: pointer; opacity: 0.6; transition: opacity 0.2s;
    }
    .lightbox-close:hover { opacity: 1; }

    /* Контакты */
    .contact { text-align: center; padding: 60px 16px 80px; border-top: 1px solid rgba(255,255,255,0.07); }
    .contact h2 { font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 500; margin-bottom: 12px; }
    .contact p { color: var(--muted); margin-bottom: 24px; }
    .contact-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .contact-link {
      padding: 12px 24px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.15);
      font-size: 0.9rem; transition: all 0.3s; display: inline-block;
    }
    .contact-link:hover { border-color: var(--accent); color: var(--accent); }

    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.8rem; }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 900px) { .gallery-grid { column-count: 2; } }
    @media (max-width: 560px) {
      :root { --pad: 4px; --gap: 4px; }
      .hero { padding: 60px 16px 40px; }
      .hero h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); }
      .hero p { font-size: 0.95rem; }
      .gallery-grid { column-count: 2; }
      .contact { padding: 40px 16px 60px; }
      .contact-links { flex-direction: column; align-items: stretch; max-width: 300px; margin: 0 auto; }
      .contact-link { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Приветствие -->
  <section class="hero">
    <div class="container">
      <h1>Привет, я <span>Трухонин Данил</span></h1>
      <p>Фотограф. Ловлю ваши самые яркие моменты, в которые точно захочется вернуться!</p>
    </div>
  </section>

  <!-- Галерея -->
  <section class="gallery">
    <div class="container">
      <div class="gallery-grid" id="galleryGrid">
        <!-- В сетке показываем кроп (21.jpg), полный размер берем из data-full (c21.jpg) -->
        <div class="gallery-item"><img src="images/21.jpg" data-full="images/c21.jpg" alt="Работа 1" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/22.jpg" data-full="images/c22.jpg" alt="Работа 2" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/24.jpg" data-full="images/c24.jpg" alt="Работа 4" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/25.jpg" data-full="images/c25.jpg" alt="Работа 5" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/26.jpg" data-full="images/c26.jpg" alt="Работа 6" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/27.jpg" data-full="images/c27.jpg" alt="Работа 7" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/29.jpg" data-full="images/c29.jpg" alt="Работа 9" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/210.jpg" data-full="images/c210.jpg" alt="Работа 10" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/211.jpg" data-full="images/c211.jpg" alt="Работа 11" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/212.jpg" data-full="images/c212.jpg" alt="Работа 12" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/213.jpg" data-full="images/c213.jpg" alt="Работа 13" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/215.jpg" data-full="images/c215.jpg" alt="Работа 15" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/216.jpg" data-full="images/c216.jpg" alt="Работа 16" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/217.jpg" data-full="images/c217.jpg" alt="Работа 17" loading="lazy" /></div>
      </div>
    </div>
  </section>

  <!-- Лайтбокс -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="Просмотр" class="lightbox-img" id="lightboxImg">
  </div>

  <!-- Контакты -->
  <section class="contact">
    <div class="container">
      <h2>Связаться со мной</h2>
      <p>Напишите, чтобы обсудить съёмку.</p>
      <div class="contact-links">
        <a href="mailto:trukhonindanil@gmail.com" class="contact-link">trukhonindanil@gmail.com</a>
        <a href="https://t.me/F1RE_RU" target="_blank" rel="noopener" class="contact-link">Telegram</a>
        <a href="https://vk.ru/f1re_ru" target="_blank" rel="noopener" class="contact-link">Вконтакте</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">© <span id="year"></span> Danil Trukhonin</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Перемешивание массива (Фишер-Йетс)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('galleryGrid');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');

      // 1. Перемешиваем галерею
      const items = Array.from(grid.children);
      const shuffledItems = shuffleArray(items);
      grid.innerHTML = '';
      shuffledItems.forEach(item => grid.appendChild(item));

      // 2. Плавное появление картинок и клик для лайтбокса
      const galleryImages = document.querySelectorAll('.gallery-item img');
      galleryImages.forEach(img => {
        if (img.complete) {
          img.classList.add('loaded');
        } else {
          img.addEventListener('load', () => img.classList.add('loaded'));
        }

        // Клик по картинке
        img.addEventListener('click', (e) => {
          // Берем полный размер из data-full (например, images/c21.jpg)
          const fullSrc = e.target.dataset.full || e.target.src;
          lightboxImg.src = fullSrc;
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        });
      });

      // 3. Закрытие лайтбокса
      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => { lightboxImg.src = ''; }, 300);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
      });
    });
  </script>

</body>
</html>

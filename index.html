<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Danil Trukhonin — Фотограф</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0e0e;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #d4af7a;
      --gap: 16px;
      --pad: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden; 
    }

    img { display: block; width: 100%; height: auto; background: #161616; }
    a { color: inherit; text-decoration: none; }

    .container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 var(--pad); }

    /* Приветствие */
    .hero { text-align: center; padding: 80px 16px 50px; }
    .hero h1 { font-size: clamp(1.8rem, 5vw, 4rem); font-weight: 500; line-height: 1.1; margin-bottom: 16px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); max-width: 520px; margin: 0 auto; font-size: 1rem; }

    /* ===== ГАЛЕРЕЯ ===== */
    .gallery { padding: 10px 0 60px; }
    
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }

    .gallery-item {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: #161616;
      cursor: pointer;
      animation: fadeIn 0.6s ease forwards;
      opacity: 0;
      aspect-ratio: 4 / 5;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .gallery-item img {
      width: 100%;
      height: 100%; 
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, opacity 0.4s ease;
      opacity: 0;
    }
    
    .gallery-item img.loaded { opacity: 1; }
    .gallery-item:hover img { transform: scale(1.04); }

    /* ===== ЛАЙТБОКС ===== */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      /* Уменьшенное размытие и легкое затемнение (10%) */
      background: rgba(0, 0, 0, 0.1); 
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px);
      overflow: hidden;
    }
    .lightbox.active { opacity: 1; pointer-events: auto; }

    /* Обертка для картинки, чтобы контролировать зум и сдвиг */
    .img-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: none; 
      transition: transform 0.3s ease, opacity 0.3s ease;
      cursor: zoom-in;
      opacity: 1;
      background: transparent;
      transform-origin: center center;
    }
    
    /* Зум по клику */
    .lightbox-img.zoomed { 
      transform: scale(2); 
      cursor: zoom-out; 
      /* Позволяем перетаскивать */
      cursor: grab;
    }
    .lightbox-img.zoomed:active { cursor: grabbing; }

    /* Анимации слайдера */
    .img-wrapper.slide-out-left { transform: translateX(-100vw) scale(0.9); opacity: 0; }
    .img-wrapper.slide-out-right { transform: translateX(100vw) scale(0.9); opacity: 0; }
    
    .img-wrapper.slide-in-right { 
      transform: translateX(100vw) scale(0.9); opacity: 0; 
      transition: none; 
    }
    .img-wrapper.slide-in-left { 
      transform: translateX(-100vw) scale(0.9); opacity: 0; 
      transition: none; 
    }

    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      color: #fff; font-size: 40px; line-height: 1;
      cursor: pointer; opacity: 0.6; transition: opacity 0.2s;
      z-index: 2010;
    }
    .lightbox-close:hover { opacity: 1; }

    /* СТРЕЛКИ */
    .lightbox-prev, .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 50px;
      font-weight: 100;
      cursor: pointer;
      padding: 20px;
      user-select: none;
      transition: color 0.2s, transform 0.2s;
      z-index: 2010;
    }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    
    .lightbox-prev:hover, .lightbox-next:hover {
      color: rgba(255, 255, 255, 1);
      transform: translateY(-50%) scale(1.1);
    }

    @media (max-width: 560px) {
      .lightbox-prev, .lightbox-next { font-size: 30px; padding: 10px; }
    }

    /* Контакты */
    .contact { text-align: center; padding: 60px 16px 80px; border-top: 1px solid rgba(255,255,255,0.07); }
    .contact h2 { font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 500; margin-bottom: 12px; }
    .contact p { color: var(--muted); margin-bottom: 24px; }
    .contact-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .contact-link {
      padding: 12px 24px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.15);
      font-size: 0.9rem; transition: all 0.3s; display: inline-block;
    }
    .contact-link:hover { border-color: var(--accent); color: var(--accent); }

    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.8rem; }

    /* АДАПТИВ */
    @media (max-width: 900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) {
      :root { --pad: 8px; --gap: 8px; }
      .hero { padding: 60px 16px 40px; }
      .hero h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); }
      .hero p { font-size: 0.95rem; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .contact { padding: 40px 16px 60px; }
      .contact-links { flex-direction: column; align-items: stretch; max-width: 300px; margin: 0 auto; }
      .contact-link { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <h1>Привет, я <span>Трухонин Данил</span></h1>
      <p>Ловлю ваши самые яркие моменты, в которые точно захочется вернуться!</p>
    </div>
  </section>

  <section class="gallery">
    <div class="container">
      <div class="gallery-grid" id="galleryGrid">
        <div class="gallery-item"><img src="images/26.jpg" data-full="images/c26.jpg" alt="Работа 6" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/27.jpg" data-full="images/c27.jpg" alt="Работа 7" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/29.jpg" data-full="images/c29.jpg" alt="Работа 9" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/21.jpg" data-full="images/c21.jpg" alt="Работа 1" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/22.jpg" data-full="images/c22.jpg" alt="Работа 2" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/24.jpg" data-full="images/c24.jpg" alt="Работа 4" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/211.jpg" data-full="images/c211.jpg" alt="Работа 11" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/213.jpg" data-full="images/c213.jpg" alt="Работа 13" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/215.jpg" data-full="images/c215.jpg" alt="Работа 15" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/216.jpg" data-full="images/c216.jpg" alt="Работа 16" loading="lazy" /></div>
        <div class="gallery-item"><img src="images/217.jpg" data-full="images/c217.jpg" alt="Работа 17" loading="lazy" /></div>
      </div>
    </div>
  </section>

  <!-- Лайтбокс с оберткой для анимации -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <div class="lightbox-prev" id="lightboxPrev">&#10094;</div>
    
    <div class="img-wrapper" id="imgWrapper">
      <img src="" alt="Просмотр" class="lightbox-img" id="lightboxImg">
    </div>
    
    <div class="lightbox-next" id="lightboxNext">&#10095;</div>
  </div>

  <section class="contact">
    <div class="container">
      <h2>Связаться со мной</h2>
      <p>Напишите, чтобы обсудить съёмку.</p>
      <div class="contact-links">
        <a href="mailto:trukhonindanil@gmail.com" class="contact-link">trukhonindanil@gmail.com</a>
        <a href="https://t.me/F1RE_RU" target="_blank" rel="noopener" class="contact-link">Telegram</a>
        <a href="https://vk.ru/f1re_ru" target="_blank" rel="noopener" class="contact-link">Вконтакте</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">© <span id="year"></span> Danil Trukhonin</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', () => {
      const lightbox = document.getElementById('lightbox');
      const imgWrapper = document.getElementById('imgWrapper');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');
      const galleryImages = Array.from(document.querySelectorAll('.gallery-item img'));

      let currentIndex = 0;
      let isAnimating = false;
      
      // Для зума и панорамирования
      let isZoomed = false;
      let isDragging = false;
      let startX, startY, scrollLeft, scrollTop;

      // Плавное появление картинок в сетке
      galleryImages.forEach((img, index) => {
        if (img.complete) img.classList.add('loaded');
        else img.addEventListener('load', () => img.classList.add('loaded'));

        img.addEventListener('click', (e) => {
          currentIndex = index;
          const fullSrc = img.dataset.full || img.src;
          lightboxImg.src = fullSrc;
          
          // Сброс зума при открытии
          resetZoom();
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        });
      });

      // Функция для сброса зума
      function resetZoom() {
        isZoomed = false;
        lightboxImg.classList.remove('zoomed');
        lightboxImg.style.transform = '';
        lightboxImg.style.transformOrigin = 'center center';
      }

      // Логика анимации слайдера
      function changeImage(direction) {
        if (isAnimating) return;
        isAnimating = true;

        // Если фото было увеличено, сбрасываем зум перед сменой
        if (isZoomed) resetZoom();

        // 1. Определяем класс для сдвига
        const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
        const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

        // 2. Уезжает
        imgWrapper.classList.add(outClass);

        setTimeout(() => {
          // Меняем картинку
          if (direction === 'next') {
            currentIndex = (currentIndex + 1) % galleryImages.length;
          } else {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
          }

          const img = galleryImages[currentIndex];
          lightboxImg.src = img.dataset.full || img.src;

          // 3. Телепортируем за экран
          imgWrapper.classList.remove(outClass);
          imgWrapper.classList.add(inClass);

          // 4. Ждем загрузки и плавно выезжаем
          const onImageReady = () => {
            // Двойной requestAnimationFrame гарантирует, что браузер применит стартовую позицию перед анимацией
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                imgWrapper.classList.remove(inClass); // Убираем класс, картинка плавно едет в центр
                setTimeout(() => { isAnimating = false; }, 400); // Ждем окончания анимации
              });
            });
          };

          if (lightboxImg.complete) onImageReady();
          else lightboxImg.onload = onImageReady;

        }, 400); // 400мс на уезд
      }

      // --- ЛОГИКА ЗУМА И ПАНОРАМИРОВАНИЯ ---

      lightboxImg.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isAnimating) return;

        isZoomed = !isZoomed;

        if (isZoomed) {
          // Зумим в точку клика
          const rect = lightboxImg.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * 100;
          const y = ((e.clientY - rect.top) / rect.height) * 100;
          
          lightboxImg.style.transformOrigin = `${x}% ${y}%`;
          lightboxImg.classList.add('zoomed');
        } else {
          resetZoom();
        }
      });

      // Перетаскивание (панорамирование) при зуме
      lightboxImg.addEventListener('mousedown', (e) => {
        if (!isZoomed) return;
        isDragging = true;
        startX = e.clientX - lightboxImg.offsetLeft;
        startY = e.clientY - lightboxImg.offsetTop;
        lightboxImg.style.cursor = 'grabbing';
        lightboxImg.style.transition = 'none'; // Отключаем плавность при перетаскивании
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.clientX - startX;
        const y = e.clientY - startY;
        
        // Сдвигаем картинку
        lightboxImg.style.transform = `scale(2) translate(${x / 2}px, ${y / 2}px)`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          lightboxImg.style.cursor = 'grab';
          lightboxImg.style.transition = 'transform 0.3s ease'; // Возвращаем плавность
        }
      });

      // --- КОНЕЦ ЛОГИКИ ЗУМА ---

      // Кнопки
      lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); changeImage('next'); });
      lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); changeImage('prev'); });

      // Клавиатура
      document.addEventListener('keydown', (e) => {
        if (lightbox.classList.contains('active')) {
          if (e.key === 'ArrowRight') changeImage('next');
          if (e.key === 'ArrowLeft') changeImage('prev');
        }
      });

      // Закрытие
      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => { 
          lightboxImg.src = ''; 
          resetZoom();
          imgWrapper.className = 'img-wrapper';
          isAnimating = false;
        }, 300);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
      });
    });
  </script>

</body>
</html>

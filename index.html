  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', () => {
      const lightbox = document.getElementById('lightbox');
      const imgWrapper = document.getElementById('imgWrapper');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');
      const galleryImages = Array.from(document.querySelectorAll('.gallery-item img'));

      let currentIndex = 0;
      let isAnimating = false;
      
      // Состояние зума и перетаскивания
      let isZoomed = false;
      let isDragging = false;
      let startX = 0, startY = 0;
      let translateX = 0, translateY = 0;
      
      // Переменные для определения "клика" vs "перетаскивания"
      let mouseDownX = 0, mouseDownY = 0;
      let hasMoved = false;

      // Инициализация галереи
      galleryImages.forEach((img, index) => {
        if (img.complete) img.classList.add('loaded');
        else img.addEventListener('load', () => img.classList.add('loaded'));

        img.addEventListener('click', (e) => {
          currentIndex = index;
          const fullSrc = img.dataset.full || img.src;
          lightboxImg.src = fullSrc;
          resetZoom();
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        });
      });

      // Сброс зума
      function resetZoom() {
        isZoomed = false;
        isDragging = false;
        translateX = 0;
        translateY = 0;
        lightboxImg.classList.remove('zoomed', 'dragging');
        lightboxImg.style.transformOrigin = 'center center';
        lightboxImg.style.transform = 'scale(1) translate(0, 0)';
        lightboxImg.style.cursor = 'zoom-in';
      }

      // --- ЗУМ И ПЕРЕТАСКИВАНИЕ ---

      lightboxImg.addEventListener('mousedown', (e) => {
        if (!isZoomed) return; // Если не увеличено, кнопка мыши нам не важна для перетаскивания
        
        e.preventDefault();
        isDragging = true;
        hasMoved = false; // Сбрасываем флаг движения
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
        
        lightboxImg.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        // Проверяем, сдвинулась ли мышь достаточно далеко (больше 3 пикселей)
        // Это нужно, чтобы отличить клик от микро-дрожания руки
        if (Math.abs(e.clientX - mouseDownX) > 3 || Math.abs(e.clientY - mouseDownY) > 3) {
          hasMoved = true;
        }
        
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        
        lightboxImg.style.transform = `scale(2.5) translate(${translateX / 2.5}px, ${translateY / 2.5}px)`;
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging) {
          isDragging = false;
          lightboxImg.classList.remove('dragging');
          
          // Если мышь не сдвинулась (это был простой клик) — срабатывает зум
          if (!hasMoved) {
            handleImageClick(e);
          }
        } else if (!isZoomed) {
          // Если мы не в режиме зума, и кликнули по картинке — тоже срабатывает зум
           if (e.target === lightboxImg) {
              handleImageClick(e);
           }
        }
      });

      // Сама логика зума (вынесена в отдельную функцию)
      function handleImageClick(e) {
        if (isAnimating) return;

        if (!isZoomed) {
          // Приближаем в точку курсора
          isZoomed = true;
          const rect = lightboxImg.getBoundingClientRect();
          
          // Считаем проценты, но ограничиваем их, чтобы не улететь за края
          let x = ((e.clientX - rect.left) / rect.width) * 100;
          let y = ((e.clientY - rect.top) / rect.height) * 100;
          
          x = Math.max(0, Math.min(100, x));
          y = Math.max(0, Math.min(100, y));
          
          lightboxImg.style.transformOrigin = `${x}% ${y}%`;
          lightboxImg.classList.add('zoomed');
          lightboxImg.style.cursor = 'grab';
          
          translateX = 0; 
          translateY = 0;
        } else {
          // Отдаляем
          resetZoom();
        }
      }

      // --- СЛАЙДЕР (ЛИСТАНИЕ) ---

      function changeImage(direction) {
        if (isAnimating) return;
        isAnimating = true;
        
        if (isZoomed) resetZoom();

        const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
        const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

        imgWrapper.classList.add(outClass);

        setTimeout(() => {
          if (direction === 'next') {
            currentIndex = (currentIndex + 1) % galleryImages.length;
          } else {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
          }

          const img = galleryImages[currentIndex];
          lightboxImg.src = img.dataset.full || img.src;

          imgWrapper.classList.remove(outClass);
          imgWrapper.classList.add(inClass);

          const onImageReady = () => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                imgWrapper.classList.remove(inClass); 
                setTimeout(() => { isAnimating = false; }, 400); 
              });
            });
          };

          if (lightboxImg.complete) onImageReady();
          else lightboxImg.onload = onImageReady;

        }, 400); 
      }

      lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); changeImage('next'); });
      lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); changeImage('prev'); });

      document.addEventListener('keydown', (e) => {
        if (lightbox.classList.contains('active')) {
          if (e.key === 'ArrowRight') changeImage('next');
          if (e.key === 'ArrowLeft') changeImage('prev');
        }
      });

      // Закрытие
      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => { 
          lightboxImg.src = ''; 
          resetZoom();
          imgWrapper.className = 'img-wrapper';
          isAnimating = false;
        }, 300);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
      });
    });
  </script>
